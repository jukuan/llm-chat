<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family House Assistant</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e95420" />

  <link rel="preconnect" href="https://assets.ubuntu.com" />
  <link rel="stylesheet"
        href="https://assets.ubuntu.com/v1/vanilla-framework-version-4.21.0.min.css" />
  <link rel="stylesheet" href="/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="shell header-row">
    <div class="brand">
      <div class="brand-icon">🏠</div>
      <div>
        <h1 data-i18n="appTitle">Family House Assistant</h1>
        <p data-i18n="appSubtitle">Ask about the house — appliances, rules, chores, WiFi.</p>
      </div>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button type="button" data-lang="en" data-i18n="langEn">EN</button>
      <button type="button" data-lang="be" data-i18n="langBe">BE</button>
    </div>
  </div>
</header>

<div id="offlineBanner" class="offline-banner" hidden></div>

<main class="shell">

  <div class="role-bar" id="roleBar">
    <button type="button" data-role="father" data-i18n="roleFather">Father</button>
    <button type="button" data-role="mother" data-i18n="roleMother">Mother</button>
    <button type="button" data-role="kid"    data-i18n="roleKid">Kid</button>
    <span class="spacer"></span>
    <label for="modelSelect" data-i18n="modelLabel">Model</label>
    <select id="modelSelect" disabled>
      <option>…</option>
    </select>
  </div>

  <div class="tabs">
    <button type="button" class="tab is-active" data-tab="chat"    data-i18n="tabChat">Chat</button>
    <button type="button" class="tab"           data-tab="context" data-i18n="tabContext">Context</button>
  </div>

  <!-- ================= CHAT TAB ================= -->
  <div class="tab-panel" data-panel="chat">
    <div class="chat-shell">

      <div class="chat-toolbar">
        <span class="status-pill" id="status" data-i18n="statusReady">Ready.</span>
        <button type="button" class="ghost-btn" id="clearChat" data-i18n="clearChat">Clear chat</button>
      </div>

      <div class="chat-log" id="log"></div>

      <div class="composer">
        <textarea id="input" data-i18n-placeholder="placeholder"
                  placeholder="Type a message…" rows="1"></textarea>
        <button type="button" class="send-btn" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- ================= CONTEXT TAB ================= -->
  <div class="tab-panel" data-panel="context" hidden>
    <div class="context-raw">
      <div class="raw-sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">📂 Files</span>
          <button type="button" class="icon-btn" id="newFileBtn" title="New file">+</button>
        </div>
        <div id="fileList" class="file-list"></div>
      </div>
      <div class="raw-editor">
        <div class="editor-header">
          <input type="text" id="fileName" data-i18n-placeholder="filenamePlaceholder"
                 placeholder="filename.md" />
          <button type="button" class="primary-btn" id="saveFileBtn" data-i18n="save">Save</button>
          <button type="button" class="danger-btn"  id="deleteFileBtn" data-i18n="delete">Delete</button>
        </div>
        <textarea id="fileContent" spellcheck="false"></textarea>
        <p class="meta" id="editorStatus"></p>
      </div>
    </div>
  </div>

</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
